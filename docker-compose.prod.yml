services:
  redis:
    image: redis:7-alpine
    container_name: examedu_redis_prod
    networks:
      - examedu_network

  backend:
    image: duongcao150103/examedu-backend:latest
    container_name: examedu_api_prod
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - examedu_network

  frontend:
    image: duongcao150103/examedu-frontend:latest
    container_name: examedu_web_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - examedu_network

networks:
  examedu_network:
    driver: bridge
