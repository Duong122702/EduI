services:
  redis:
    image: redis:7-alpine
    container_name: examedu_redis
    ports:
      - "6379:6379"
    networks:
      - examedu_network

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    container_name: examedu_api
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    networks:
      - examedu_network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: examedu_web
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - examedu_network

networks:
  examedu_network:
    driver: bridge
